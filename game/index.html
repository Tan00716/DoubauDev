<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>烬堡 EMBERHOLD - M1 垂直切片</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      color: #eee;
      font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
    }
    #canvas-container {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1;
    }
    #ui-layer {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 10;
      pointer-events: none;
    }
    #ui-layer > * { pointer-events: auto; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="canvas-container"></div>
    <div id="ui-layer"></div>
  </div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
